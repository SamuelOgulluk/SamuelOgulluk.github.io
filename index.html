<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Samuel Ogulluk — aspiring researcher in electrical engineering, computer science and applied mathematics." />
    <title>Samuel Ogulluk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ['Outfit', 'sans-serif'],
              body: ['IBM Plex Sans', 'sans-serif'],
            },
            colors: {
              ink: '#14241c',
              soft: '#3a4f44',
              muted: '#6a7d72',
              line: '#d5e4da',
              accent: {
                DEFAULT: '#2f8f5b',
                hover: '#247448',
                teal: '#3fa96e',
              },
              paper: {
                DEFAULT: '#fbfdfb',
                deep: '#eef6f0',
              },
            },
            keyframes: {
              expand: {
                '0%': { transform: 'scale(1) translateY(0)', transformOrigin: 'top' },
                '50%': { transform: 'scale(1.02) translateY(0)', transformOrigin: 'center' },
                '100%': { transform: 'scale(1) translateY(0)', transformOrigin: 'center' },
              },
              collapse: {
                '0%': { transform: 'scale(1) translateY(0)', transformOrigin: 'center' },
                '50%': { transform: 'scale(1.02) translateY(0)', transformOrigin: 'top' },
                '100%': { transform: 'scale(1) translateY(0)', transformOrigin: 'top' },
              },
            },
            animation: {
              expand: 'expand 500ms ease-out forwards',
              collapse: 'collapse 500ms ease-out forwards',
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
