<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Samuel Ogulluk — Electronic & IT Engineering student. Robotics, algorithms, and physical systems." />
    <title>Samuel Ogulluk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ['Fraunces', 'serif'],
              body: ['IBM Plex Sans', 'sans-serif'],
            },
            colors: {
              ink: '#18201c',
              soft: '#3d4a44',
              muted: '#6b7872',
              line: '#d2ddd5',
              accent: {
                DEFAULT: '#1a7a6d',
                hover: '#146358',
                teal: '#2f9e8f',
              },
              paper: {
                DEFAULT: '#f4f7f4',
                deep: '#e8efe9',
              },
            },
            keyframes: {
              expand: {
                '0%': { transform: 'scale(1) translateY(0)', transformOrigin: 'top' },
                '50%': { transform: 'scale(1.02) translateY(0)', transformOrigin: 'center' },
                '100%': { transform: 'scale(1) translateY(0)', transformOrigin: 'center' },
              },
              collapse: {
                '0%': { transform: 'scale(1) translateY(0)', transformOrigin: 'center' },
                '50%': { transform: 'scale(1.02) translateY(0)', transformOrigin: 'top' },
                '100%': { transform: 'scale(1) translateY(0)', transformOrigin: 'top' },
              },
            },
            animation: {
              expand: 'expand 500ms ease-out forwards',
              collapse: 'collapse 500ms ease-out forwards',
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
