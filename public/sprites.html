<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Sprites – aperçu</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #2a1a12; color: #f4e8d8; }
      h1 { padding: 24px 28px 8px; font-size: 1.2rem; font-weight: 600; }
      p { padding: 0 28px 20px; color: #c9b29a; max-width: 72ch; line-height: 1.5; }
      .row { display: flex; gap: 24px; padding: 0 28px 40px; flex-wrap: wrap; align-items: flex-start; }
      .card { background: #ece0cc; border-radius: 10px; overflow: hidden; box-shadow: 0 8px 24px #0006; max-width: 340px; }
      .card img { width: 100%; display: block; }
      .label { padding: 10px 12px; background: #1a120e; color: #f4e8d8; font-size: 0.95rem; }
    </style>
  </head>
  <body>
    <h1>1 · Guitare — Ibanez noire et blanche, stand, contours doux</h1>
    <p>Rendu 3D de face (très léger profil), puis liseré pixelisé fin cuit dans le sprite. Les fills restent le rendu 3D.</p>
    <div class="row">
      <div class="card">
        <img src="/assets/sprites/01-guitar-raw.png" alt="Rendu 3D brut" />
        <div class="label">Rendu 3D brut</div>
      </div>
      <div class="card">
        <img src="/assets/sprites/01-guitar.png" alt="Sprite cuit" />
        <div class="label">Sprite cuit (liseré 2px)</div>
      </div>
    </div>
  </body>
</html>
